[package]
name = "zcode-account-manager"
version = "0.8.0"
edition = "2021"
description = "GUI account backup, switching, and local state management for ZCode on Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["glow", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"

# XEmbed 托盘（X11 协议）仅 Linux 使用
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

# Win32 托盘图标与 CLI 控制台附着
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
